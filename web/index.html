<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07080C">
  <meta name="referrer" content="no-referrer">
  <title>EinthuTv</title>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EinthuTv">
  <meta name="application-name" content="EinthuTv">
  <link rel="stylesheet" href="assets/app.css?v=4">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="#/">EINTHU<span>TV</span></a>
    <nav class="tabs" aria-label="Main">
      <a href="#/" data-tab="home">Home</a>
      <a href="#/movies" data-tab="movies">Movies</a>
      <a href="#/browse" data-tab="browse">Browse</a>
    </nav>
    <a class="account" href="https://einthusan.tv/account/" target="_blank" rel="noopener">Sign in / Premium ↗</a>
  </header>

  <main id="view"></main>

  <!-- Movie panel -->
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <button class="sheet-x" data-close aria-label="Close">✕</button>
      <img id="sheetPoster" class="sheet-poster" alt="" referrerpolicy="no-referrer">
      <div class="sheet-body">
        <h2 id="sheetTitle"></h2>
        <div class="meta"><span id="sheetMeta"></span> <span id="sheetBadges" class="badges"></span></div>
        <p id="sheetDesc"></p>
        <div class="actions">
          <a id="sheetWatch" class="btn btn-primary" target="_blank" rel="noopener">▶&nbsp; Watch</a>
          <button class="btn btn-outline" data-close>Close</button>
        </div>
        <div class="versions">
          <div class="versions-label">Also in other languages</div>
          <div id="sheetLangs" class="versions-list"></div>
        </div>
        <p class="note">Opens einthusan.tv in a new tab. Sign in there once to watch with your Premium account.</p>
      </div>
    </div>
  </div>

  <script src="assets/app.js?v=4"></script>
</body>
</html>
